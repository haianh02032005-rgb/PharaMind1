name: Build Linux desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-linux-v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build and verify Ubuntu packages
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Build AppImage and Debian package
        run: |
          set -o pipefail
          if npm run dist:linux 2>&1 | tee linux-build.log; then
            exit 0
          fi
          summary="$(tail -n 25 linux-build.log | tr '\n' ' ' | cut -c 1-3000)"
          summary="${summary//'%'/'%25'}"
          echo "::error title=Linux packaging failed::$summary"
          exit 1

      - name: Verify Debian package metadata
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E 'pharmamind-ai|PharmaMind'

      - name: Generate SHA-256 checksums
        run: sha256sum dist/*.AppImage dist/*.deb > dist/SHA256SUMS-linux.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaMind-AI-Linux-x64
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.AppImage \
            dist/*.deb \
            dist/SHA256SUMS-linux.txt \
            --title "PharmaMind AI Desktop for Linux ${GITHUB_REF_NAME#desktop-linux-v}" \
            --notes "Linux x64 release for Ubuntu and Debian. Download the AppImage to run without installation, or install the DEB package through Ubuntu App Center."
