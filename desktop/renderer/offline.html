<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; navigate-to https://pharmamind-ai-demo.onrender.com"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaMind AI - Mất kết nối</title>
    <style>
      :root {
        color: #17343a;
        background: #f7fafa;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(480px, calc(100vw - 48px));
        padding: 36px;
        border: 1px solid #dcecec;
        border-radius: 22px;
        background: white;
        box-shadow: 0 12px 40px rgba(23, 52, 58, 0.09);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0 0 24px;
        color: #5b7c83;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 12px;
        background: #2e9c95;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../assets/icon.png" alt="PharmaMind AI" />
      <h1>Không kết nối được máy chủ</h1>
      <p>
        Hãy kiểm tra Internet rồi thử lại. Máy chủ miễn phí có thể cần khoảng
        một phút để khởi động sau thời gian không hoạt động.
      </p>
      <a href="https://pharmamind-ai-demo.onrender.com">Thử kết nối lại</a>
    </main>
  </body>
</html>
